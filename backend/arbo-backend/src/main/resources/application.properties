spring.application.name=arbo-backend

# Banco de dados temporário H2
spring.datasource.url=jdbc:h2:mem:arbo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# Endpoints de monitoramento
management.endpoints.access.default=read-only
management.endpoints.web.exposure.include=health,info,prometheus

# Identificação da aplicação nas métricas
management.metrics.tags.application=arbo-backend
# Porta: a hospedagem informa pela variável PORT 
server.port=${PORT:8080}

# Banco: sem variáveis = H2 em memória. Publicado = MySQL do Railway.
spring.datasource.url=${DB_URL:jdbc:h2:mem:arbo}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# create = recria as tabelas a cada início (H2) | update = cria sem apagar dados (MySQL)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Endereço do front autorizado no CORS
arbo.cors.allowed-origins=${ARBO_CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.forward-headers-strategy=framework
