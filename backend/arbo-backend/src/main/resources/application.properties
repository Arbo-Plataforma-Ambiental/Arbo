
spring.application.name=arbo-backend

# Conexão com H2 (banco salvo em arquivo na pasta ./data)
spring.datasource.url=jdbc:h2:file:./data/arbo;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas a partir do schema.sql ao iniciar a aplicação
spring.sql.init.mode=always

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurações JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
